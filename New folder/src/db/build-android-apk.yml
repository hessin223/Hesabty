name: Build Android APK (Hesabty | حسابتي)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build-apk:
    name: Run Tests & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hesabty Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17 (Android Gradle compatibility)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund
        timeout-minutes: 10

      - name: Run Automated Unit & Ledger Integrity Tests
        run: npm test

      - name: Build Production Web Assets (Vite + TypeScript)
        run: npm run build
        timeout-minutes: 10

      - name: Initialize & Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        timeout-minutes: 30

      - name: Verify Generated APK Exists
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Hesabty Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabty-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
